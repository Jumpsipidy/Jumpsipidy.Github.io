<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumpsipidy.online | Professional Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: Modern, Clean Variables */
        :root {
            --bg-base: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent-1: #007aff; /* Professional Blue */
            --accent-2: #8a2be2; /* Soft Purple */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient "Aurora" Background Animation */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: -1;
            background: var(--bg-base);
        }

        .aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite alternate;
        }

        .aurora-1 {
            top: -10%; left: 20%;
            width: 50vw; height: 50vw;
            background: var(--accent-1);
        }

        .aurora-2 {
            bottom: -10%; right: 10%;
            width: 40vw; height: 40vw;
            background: var(--accent-2);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        /* Language Selection Screen */
        #lang-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px); /* Frosted glass effect */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .lang-title {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 40px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .lang-container {
            display: flex;
            gap: 20px;
        }

        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 35px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 30px; /* Pill shape for modern look */
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Main Hub */
        #main-hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
            pointer-events: none; /* Disabled until visible */
        }

        .hub-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .hub-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #a1a1a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hub-subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Modern App Cards (Replaces standard buttons) */
        .app-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px 30px;
            text-decoration: none;
            color: var(--text-main);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .app-info {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .app-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .app-arrow {
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .app-card:hover .app-arrow {
            transform: translateX(5px);
            color: var(--text-main);
        }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
    </div>

    <div id="lang-screen">
        <div class="lang-title">Select your language</div>
        <div class="lang-container">
            <button class="lang-btn" onclick="startApp('en')">English</button>
            <button class="lang-btn" onclick="startApp('lt')">Lietuviškai</button>
        </div>
    </div>

    <div id="main-hub">
        
        <div class="hub-header">
            <h1 class="hub-title">Jumpsipidy.online</h1>
            <div class="hub-subtitle" id="hub-subtitle">Personal Portfolio & App Hub</div>
        </div>

        <div class="app-grid">
            <a href="https://jumpsipidy.online/jumpsipidy" class="app-card">
                <div class="app-info">
                    <span class="app-name" id="name-portfolio">Portfolio</span>
                    <span class="app-desc" id="desc-portfolio">View my latest work and projects</span>
                </div>
                <span class="app-arrow">→</span>
            </a>

            <a href="https://ai-document-builder-659410443561.europe-west2.run.app" class="app-card">
                <div class="app-info">
                    <span class="app-name" id="name-doc">AI Document Builder</span>
                    <span class="app-desc" id="desc-doc">Generate professional documents instantly</span>
                </div>
                <span class="app-arrow">→</span>
            </a>

            <a href="https://jumpsipidy.online/ElijasGPT" class="app-card">
                <div class="app-info">
                    <span class="app-name" id="name-gpt">ElijasGPT</span>
                    <span class="app-desc" id="desc-gpt">AI-powered helper and tools</span>
                </div>
                <span class="app-arrow">→</span>
            </a>
        </div>

    </div>

    <script>
        const content = {
            en: {
                subtitle: "Personal Portfolio & App Hub",
                portfolioName: "Jumpsipidy Portfolio",
                portfolioDesc: "View my latest work and projects",
                docName: "AI Document Builder",
                docDesc: "Generate professional documents instantly",
                gptName: "ElijasGPT",
                gptDesc: "AI-powered helper and tools"
            },
            lt: {
                subtitle: "Asmeninis Portfolio ir Programų Centras",
                portfolioName: "Jumpsipidy Portfolio",
                portfolioDesc: "Peržiūrėkite mano naujausius darbus ir projektus",
                docName: "AI Dokumentų Kūrėjas",
                docDesc: "Akimirksniu kurkite profesionalius dokumentus",
                gptName: "ElijasGPT",
                gptDesc: "AI pagalbininkas ir įrankiai"
            }
        };

        function startApp(lang) {
            // 1. Update text based on chosen language
            document.getElementById('hub-subtitle').innerText = content[lang].subtitle;
            document.getElementById('name-portfolio').innerText = content[lang].portfolioName;
            document.getElementById('desc-portfolio').innerText = content[lang].portfolioDesc;
            document.getElementById('name-doc').innerText = content[lang].docName;
            document.getElementById('desc-doc').innerText = content[lang].docDesc;
            document.getElementById('name-gpt').innerText = content[lang].gptName;
            document.getElementById('desc-gpt').innerText = content[lang].gptDesc;

            // 2. Smoothly hide language screen
            const langScreen = document.getElementById('lang-screen');
            langScreen.style.opacity = '0';
            
            // 3. Smoothly reveal the main hub
            setTimeout(() => {
                langScreen.style.visibility = 'hidden'; 
                
                const mainHub = document.getElementById('main-hub');
                mainHub.style.opacity = '1';
                mainHub.style.transform = 'translateY(0)';
                mainHub.style.pointerEvents = 'auto'; 
            }, 500); 
        }
    </script>

</body>
</html>
