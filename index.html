<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumpsipidy.online</title>
    <style>
        /* CSS: Core Variables */
        :root {
            --cyan: #00f0ff;
            --purple: #7000ff;
            --pink: #ff00c8;
            --bg: #050505;
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace; /* Hacker font vibe */
            overflow: hidden;
            perspective: 1000px;
        }

        /* 3D Moving Neon Grid Background */
        .grid-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: -2;
        }
        
        .grid {
            position: absolute;
            bottom: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.3) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(0);
            animation: gridMove 3s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        /* Dark fade at the top of the grid */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center 30%, transparent 10%, var(--bg) 70%);
            z-index: -1;
        }

        /* Language Screen */
        #lang-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sys-text {
            color: var(--cyan);
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--cyan);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .lang-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--purple);
            padding: 15px 40px;
            margin: 15px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(112, 0, 255, 0.2) inset;
        }

        .lang-btn:hover {
            background: rgba(112, 0, 255, 0.3);
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan), 0 0 20px var(--cyan) inset;
            text-shadow: 0 0 5px white;
        }

        /* Main Hub */
        #main-hub {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            z-index: 10;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1s ease-out;
        }

        /* Glitch Title Effect */
        .glitch-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            color: white;
            text-shadow: 0 0 20px var(--cyan);
            margin-bottom: 50px;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 2px;
        }

        .glitch-title::before, .glitch-title::after {
            content: 'Jumpsipidy.online';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
        }

        .glitch-title::before {
            left: 3px;
            text-shadow: -2px 0 var(--pink);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -3px;
            text-shadow: -2px 0 var(--cyan);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 44px, 0); }
            20% { clip: rect(80px, 9999px, 12px, 0); }
            40% { clip: rect(32px, 9999px, 90px, 0); }
            60% { clip: rect(98px, 9999px, 40px, 0); }
            80% { clip: rect(15px, 9999px, 70px, 0); }
            100% { clip: rect(65px, 9999px, 20px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(15px, 9999px, 80px, 0); }
            40% { clip: rect(98px, 9999px, 20px, 0); }
            60% { clip: rect(32px, 9999px, 90px, 0); }
            80% { clip: rect(80px, 9999px, 44px, 0); }
            100% { clip: rect(10px, 9999px, 12px, 0); }
        }

        /* Cyberpunk App Buttons */
        .app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 350px;
            padding: 20px;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(0, 240, 255, 0.3);
            color: var(--cyan);
            text-decoration: none;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .app-btn::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 20px; height: 4px;
            background: var(--pink);
            box-shadow: 0 0 10px var(--pink);
            transition: width 0.3s ease;
        }

        .app-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--cyan);
            color: white;
            text-shadow: 0 0 10px var(--cyan);
            transform: translateX(10px);
            box-shadow: -10px 0 20px rgba(0, 240, 255, 0.2);
        }

        .app-btn:hover::after {
            width: 100%;
        }

        .btn-purple {
            border-color: rgba(112, 0, 255, 0.5);
            color: #b97bff;
        }
        
        .btn-purple:hover {
            background: rgba(112, 0, 255, 0.1);
            border-color: var(--purple);
            box-shadow: -10px 0 20px rgba(112, 0, 255, 0.3);
            text-shadow: 0 0 10px var(--purple);
        }

    </style>
</head>
<body>

    <!-- 3D Moving Background -->
    <div class="grid-container">
        <div class="grid"></div>
        <div class="vignette"></div>
    </div>

    <!-- Startup Language Screen -->
    <div id="lang-screen">
        <div class="sys-text">SYSTEM_INIT // SELECT_LANGUAGE_</div>
        <div>
            <button class="lang-btn" onclick="startSystem('en')">[ ENG ]</button>
            <button class="lang-btn" onclick="startSystem('lt')">[ LTU ]</button>
        </div>
    </div>

    <!-- Main Hub -->
    <div id="main-hub">
        
        <!-- Glitching Title -->
        <div class="glitch-title">Jumpsipidy.online</div>

        <!-- Buttons -->
        <a href="https://jumpsipidy.online/jumpsipidy" class="app-btn" id="btn-portfolio">
            Jumpsipidy Portfolio
        </a>

        <a href="https://ai-document-builder-659410443561.europe-west2.run.app" class="app-btn btn-purple" id="btn-doc-builder">
            AI Document Builder
        </a>

    </div>

    <!-- Javascript Logic -->
    <script>
        const translations = {
            en: {
                portfolio: "JUMPSIPIDY PORTFOLIO",
                docBuilder: "AI DOCUMENT BUILDER"
            },
            lt: {
                portfolio: "JUMPSIPIDY PORTFOLIO", 
                docBuilder: "AI DOKUMENTŲ KŪRĖJAS"
            }
        };

        function startSystem(lang) {
            const langScreen = document.getElementById('lang-screen');
            const mainHub = document.getElementById('main-hub');

            // Apply translations instantly
            document.getElementById('btn-portfolio').innerText = translations[lang].portfolio;
            document.getElementById('btn-doc-builder').innerText = translations[lang].docBuilder;

            // Cool zoom out and fade effect for the language screen
            langScreen.style.transform = 'scale(1.5)';
            langScreen.style.opacity = '0';
            
            setTimeout(() => {
                langScreen.style.display = 'none';
                
                // Pop in the main hub
                mainHub.style.display = 'flex';
                // Trigger a small delay so the CSS transition catches the change
                setTimeout(() => {
                    mainHub.style.opacity = '1';
                    mainHub.style.transform = 'scale(1)';
                }, 50);
                
            }, 800); // Matches the CSS transition time
        }
    </script>

</body>
</html>
